name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: |
          cargo +1.99.0 fmt --all --check
          rustfmt +1.99.0 --edition 2024 --check examples/hello/main.rs
      - name: Clippy
        run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
      - name: Check documentation and examples
        run: |
          python3 scripts/check-changelog.py
          python3 scripts/test-release.py
          python3 scripts/test-component-images.py
          python3 scripts/test-mixed-e2e.py
          python3 scripts/test-install-e2e.py
          python3 scripts/test-upgrade-e2e.py
          python3 scripts/test-helm-diagnostics.py
          python3 scripts/check-docs.py
          python3 scripts/check-site.py
          node --check site/site.js
          node --check site/docs/docs.js
      - name: Verify Helm and native installer resource parity
        run: |
          python3 scripts/fetch-helm.py --out .local/helm
          python3 scripts/check-chart.py --helm .local/helm
          python3 scripts/test-gitops-chart.py --helm .local/helm
      - name: Verify publishable crates
        run: cargo +1.99.0 package --locked --workspace --exclude kimage-bootstrap

  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux/amd64 musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: Linux/arm64 musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macOS/arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Run workspace tests
        run: cargo +1.99.0 test --locked --workspace --target ${{ matrix.target }}
      - name: Build tutorial executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p .local/tutorial
          rustc +1.99.0 --edition=2024 --target ${{ matrix.target }} \
            -C opt-level=z -C strip=symbols -C panic=abort \
            examples/hello/main.rs -o .local/tutorial/hello
