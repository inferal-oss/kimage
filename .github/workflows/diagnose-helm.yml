name: Focused Helm lifecycle diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed native component build run in this repository
        type: string
        required: true
      source_commit:
        description: Exact source commit of those components
        type: string
        required: true
      diagnostic_certificate:
        description: Public X.509 recipient certificate; keep its private key outside CI
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  diagnose:
    name: ${{ matrix.architecture }} / ${{ matrix.scope }} / Helm lifecycle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        scope: [namespace, cluster]
        include:
          - architecture: amd64
            os: ubuntu-24.04
          - architecture: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity and unchanged component code
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run=os.environ['SOURCE_RUN'];commit=os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9]+',run) and re.fullmatch(r'[0-9a-f]{40}',commit)
          metadata=json.loads(subprocess.check_output(['gh','api',f'repos/inferal-oss/kimage/actions/runs/{run}']))
          assert metadata['head_sha']==commit and metadata['head_repository']['full_name']=='inferal-oss/kimage'
          subprocess.run(['git','merge-base','--is-ancestor',commit,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',commit,'HEAD','--','Cargo.toml','Cargo.lock','crates'],check=True)
          print('Verified exact native artifact source; component code is unchanged.')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: e2e-native-${{ matrix.architecture }}
          path: .local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: component-layouts
          path: .local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: component-catalog-chart
          path: .local/chart
      - name: Prepare native cluster and encrypted diagnostic wrapper
        env:
          KIMAGE_HELM_DIAGNOSTIC_CERT: ${{ inputs.diagnostic_certificate }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          python3 scripts/fetch-helm.py --out .local/helm
          sudo install -m 755 .local/helm /usr/local/bin/helm
          mkdir -p .local/e2e .local/components
          tar -xzf .local/e2e-native-${{ matrix.architecture }}.tar.gz -C .local/e2e
          tar -xzf .local/component-layouts.tar.gz -C .local/components
          python3 scripts/prepare-image-pull-fixture.py --images .local/components --registry .local/e2e/registry --directory .local/e2e-registry
          python3 scripts/helm-diagnostics.py --setup .local/e2e/helm-diagnostics --helm /usr/local/bin/helm
          printf '%s\n' "$GITHUB_WORKSPACE/.local/e2e/helm-diagnostics/bin" >> "$GITHUB_PATH"
      - name: Start pinned disposable Kubernetes fixture
        run: python3 scripts/prepare-e2e-cluster.py --directory .local/e2e-cluster
      - name: Exercise the preceding fresh-install stage
        run: |
          python3 scripts/e2e-install.py --scope ${{ matrix.scope }} --mode helm \
            --image-catalog "$KIMAGE_E2E_IMAGE_CATALOG" --chart .local/chart/kimage-*.tgz \
            --installer .local/e2e/kimage-install --probe .local/e2e/probe --output .local/e2e/results
      - name: Exercise interrupted Helm upgrade and rollback
        env:
          TEST_SCOPE: ${{ matrix.scope }}
        run: |
          python3 - <<'PY'
          import glob,json,os,subprocess
          from pathlib import Path
          context=subprocess.check_output(['k3s','kubectl','config','current-context'],text=True).strip()
          config=dict(kubeconfig=os.environ['KUBECONFIG'],context=context,namespace='upgrade-app',systemNamespace='upgrade-system',installation='upgrade',probes=str(Path('.local/e2e/probes').resolve()),output=str(Path('.local/e2e/lifecycle').resolve()),installer=str(Path('.local/e2e/kimage-install').resolve()),previous=str(Path('.local/e2e/previous').resolve()),catalog=os.environ['KIMAGE_E2E_IMAGE_CATALOG'],chart=str(Path(glob.glob('.local/chart/kimage-*.tgz')[0]).resolve()),mode='helm',scope=os.environ['TEST_SCOPE'],runtimeProfile='k3s',port=17702,registryNode='kimage-e2e',kubectlCommand=['k3s','kubectl'])
          Path('.local/e2e/config.json').write_text(json.dumps(config))
          PY
          python3 scripts/e2e-upgrade.py --run --config .local/e2e/config.json
      - name: Upload sanitized receipts and encrypted failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helm-diagnostic-${{ matrix.architecture }}-${{ matrix.scope }}
          path: |
            .local/e2e/lifecycle/results.json
            .local/e2e/results/results.json
            .local/e2e/helm-diagnostics/output/*.p7m
          if-no-files-found: warn
          retention-days: 3
