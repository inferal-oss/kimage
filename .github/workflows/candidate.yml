name: Release candidate images

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Optional successful Native Kubernetes E2E run for this exact commit
        type: string
        required: false
        default: ""
      diagnostic_certificate:
        description: Optional public X.509 certificate; keep its private key outside CI
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: kimage-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'inferal-oss/kimage' && github.ref == 'refs/heads/main' && inputs.source_run == ''
    uses: ./.github/workflows/e2e.yml
    with:
      diagnostic_certificate: ${{ inputs.diagnostic_certificate }}
      diagnostic_stress: true

  images:
    name: Publish immutable candidate images
    if: always() && github.repository == 'inferal-oss/kimage' && github.ref == 'refs/heads/main' && (needs.acceptance.result == 'success' || inputs.source_run != '' && needs.acceptance.result == 'skipped')
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reused acceptance belongs to this exact source
        if: inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import json,os,re,subprocess
          run=os.environ['SOURCE_RUN'];assert re.fullmatch(r'[0-9]+',run)
          metadata=json.loads(subprocess.check_output(['gh','api',f'repos/inferal-oss/kimage/actions/runs/{run}']))
          assert metadata['head_sha']==os.environ['EXPECTED_SHA']
          assert metadata['head_repository']['full_name']=='inferal-oss/kimage'
          assert metadata['path']=='.github/workflows/e2e.yml' and metadata['status']=='completed' and metadata['conclusion']=='success'
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/inferal-oss/kimage/actions/runs/{run}/jobs?per_page=100']))['jobs']
          cases=[j for j in jobs if j['name'].endswith(' install')]
          assert len(cases)==8 and all(j['conclusion']=='success' for j in cases)
          print('Verified all eight native acceptance cases for the exact candidate commit.')
          PYVERIFY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || github.run_id }}
          name: component-layouts
          path: .local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || github.run_id }}
          name: argocd-next-layouts
          path: .local
      - name: Publish and verify public native indexes
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir -p .local/components
          tar -xzf .local/component-layouts.tar.gz -C .local/components
          python3 scripts/publish-component-images.py --images .local/components \
            --candidate-tag candidate-${{ github.sha }} --public-wait 1800
          mkdir -p .local/next-components
          tar -xzf .local/argocd-next-layouts.tar.gz -C .local/next-components
          python3 scripts/publish-component-images.py --images .local/next-components \
            --candidate-tag argocd-conformance-${{ github.sha }} --public-wait 1800
