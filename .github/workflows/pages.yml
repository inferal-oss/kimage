name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/check-site.py
      - scripts/export-site-docs.py
      - scripts/site-release-ready.py
      - scripts/build-chart-repository.py
      - Cargo.toml
      - .github/workflows/pages.yml
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static site
        run: |
          python3 scripts/check-site.py
          node --check site/site.js
          node --check site/docs/docs.js
      - name: Wait for public install artifacts before changing the website
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site-release-ready.py
      - name: Build the public Helm chart repository
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-chart-repository.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.ready == 'true'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.release_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
