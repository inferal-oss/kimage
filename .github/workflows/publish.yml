name: Publish release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify assets without publishing (main or a release tag)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kimage-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  validate:
    name: Validate release source
    if: github.repository == 'inferal-oss/kimage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['workspace']['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match workspace version'
          else:
              assert os.environ['RELEASE_REF'] == 'refs/heads/main' and os.environ['DRY_RUN'] == 'true', 'main allows build previews only'
          PY
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-validate-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Check source and documentation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python3 scripts/check-changelog.py
          python3 scripts/test-release.py
          python3 scripts/test-component-images.py
          python3 scripts/test-mixed-e2e.py
          python3 scripts/test-install-e2e.py
          python3 scripts/test-upgrade-e2e.py
          python3 scripts/test-argocd-e2e.py
          python3 scripts/test-argocd-next.py
          python3 scripts/test-helm-diagnostics.py
          python3 scripts/check-docs.py
          python3 scripts/check-site.py
          node --check site/site.js
          node --check site/docs/docs.js

  native:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Build macOS installer
        run: |
          cargo build --locked --release --package kimage-control --bin kimage-install --target ${{ matrix.target }}
          tar -czf "$RUNNER_TEMP/native-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release kimage-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  acceptance:
    name: Registry-pull Kubernetes acceptance
    needs: validate
    uses: ./.github/workflows/e2e.yml

  assets:
    name: Assemble installers, catalog and Helm chart
    needs: [native, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          merge-multiple: true
          path: .local/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: e2e-native-*
          merge-multiple: true
          path: .local/native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: component-catalog-chart
          path: .local/chart
      - name: Install Cargo metadata toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Assemble verified release assets
        run: |
          mkdir -p .local/installers/linux-amd64 .local/installers/linux-arm64 .local/installers/darwin-amd64 .local/installers/darwin-arm64
          tar -xzf .local/native/e2e-native-amd64.tar.gz -C .local/installers/linux-amd64 kimage-install
          tar -xzf .local/native/e2e-native-arm64.tar.gz -C .local/installers/linux-arm64 kimage-install
          tar -xzf .local/native/native-x86_64-apple-darwin.tar.gz -C .local/installers/darwin-amd64
          tar -xzf .local/native/native-aarch64-apple-darwin.tar.gz -C .local/installers/darwin-arm64
          cargo metadata --locked --format-version 1 > .local/cargo-metadata.json
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/package-image-release.py --catalog .local/chart/component-images.json \
            --chart ".local/chart/kimage-${VERSION}.tgz" --installers .local/installers \
            --metadata .local/cargo-metadata.json --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/release/*
          compression-level: 0
          retention-days: 7

  images:
    name: Publish and verify public GHCR components
    needs: [acceptance, assets]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: component-layouts
          path: .local
      - name: Publish standard OCI indexes without changing their digests
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir -p .local/components
          tar -xzf .local/component-layouts.tar.gz -C .local/components
          python3 scripts/publish-component-images.py --images .local/components --public-wait 1800

  publish:
    name: Publish tagged assets and crates through OIDC
    needs: [assets, images]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.assets.result == 'success' && (needs.images.result == 'success' || inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-validate-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Stage exact assets in a draft GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-github-release.py --tag "$RELEASE_TAG" --assets dist/release
      - name: Authenticate with crates.io through OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify publishable packages
        if: inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py --dry-run
      - name: Publish packages in dependency order or verify identical prior uploads
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py
      - name: Publish complete GitHub release and verify automatic download
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          KIMAGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-github-release.py --tag "$RELEASE_TAG" --assets dist/release --finalize
          python3 scripts/publish-component-images.py --images dist/release --verify-only
          gh api --method POST repos/inferal-oss/kimage/dispatches -f event_type=release-published
