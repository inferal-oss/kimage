name: Publish crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify packaging and OIDC without uploading a release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  publish:
    name: Validate and publish tagged release
    if: github.repository == 'inferal-oss/kimage' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match workspace version'
          PY
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Validate release
        run: |
          cargo +1.99.0 fmt --all --check
          cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.99.0 test --locked --workspace
          python3 scripts/check-docs.py
          python3 scripts/check-site.py
          node --check site/site.js
          node --check site/docs/docs.js
      - name: Authenticate with crates.io through OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify publishable packages
        if: inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.99.0 publish --dry-run --locked --workspace --exclude kimage-bootstrap
      - name: Publish packages in dependency order
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.99.0 publish --locked --workspace --exclude kimage-bootstrap
