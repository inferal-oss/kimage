name: Publish release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify assets without publishing (main or a release tag)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kimage-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  validate:
    name: Validate release source
    if: github.repository == 'inferal-oss/kimage'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['workspace']['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match workspace version'
          else:
              assert os.environ['RELEASE_REF'] == 'refs/heads/main' and os.environ['DRY_RUN'] == 'true', 'main allows build previews only'
          PY
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-validate-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Check source and documentation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python3 scripts/check-changelog.py
          python3 scripts/test-release.py
          python3 scripts/test-mixed-e2e.py
          python3 scripts/check-docs.py
          python3 scripts/check-site.py
          node --check site/site.js
          node --check site/docs/docs.js

  native:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Build Linux components and installer
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
          tar -czf "$RUNNER_TEMP/native-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release \
            kimage-bootstrap kimage-install kimage-gateway kimage-proxy \
            kimage-operator kimage-admission kimage-input kimage-exporter
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --package kimage-control --bin kimage-install --target ${{ matrix.target }}
          tar -czf "$RUNNER_TEMP/native-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release kimage-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  acceptance:
    name: Native Kubernetes acceptance
    needs: validate
    uses: ./.github/workflows/e2e.yml

  bundle:
    name: Verify complete ${{ matrix.architecture }} bundle
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: .local/release-native
      - name: Unpack native binaries
        run: |
          mkdir -p .local/release-native/linux .local/release-native/macos-arm64 .local/release-native/macos-amd64
          tar -xzf .local/release-native/native-${{ matrix.target }}.tar.gz -C .local/release-native/linux
          tar -xzf .local/release-native/native-aarch64-apple-darwin.tar.gz -C .local/release-native/macos-arm64
          tar -xzf .local/release-native/native-x86_64-apple-darwin.tar.gz -C .local/release-native/macos-amd64
      - name: Fetch pinned upstream executables
        run: python3 scripts/fetch-release-inputs.py --architecture ${{ matrix.architecture }} --out .local/upstream-release
      - name: Build and natively verify complete offline bundle
        run: |
          python3 scripts/package-bundle.py --architecture ${{ matrix.architecture }} --linux-dir .local/release-native/linux \
            --registry .local/upstream-release/registry --registry-version 3.1.2 --serving-version 0.3.0 \
            --buildkit-dir .local/upstream-release/buildkit --include-installers \
            --macos-installer .local/release-native/macos-arm64/kimage-install \
            --macos-amd64-installer .local/release-native/macos-amd64/kimage-install --out dist/bundle
          python3 - <<'PY'
          import json, subprocess, re, hashlib
          from pathlib import Path
          version = re.search(r'(?ms)^\[workspace\.package\]\s*\n.*?^version\s*=\s*"([^"]+)"', Path('Cargo.toml').read_text())[1]
          for role in ['operator', 'admission', 'input', 'exporter', 'install', 'gateway', 'proxy']:
              actual = subprocess.check_output(['.local/release-native/linux/kimage-' + role, '--version'], text=True).strip()
              assert actual == 'kimage-' + role + ' ' + version, actual
          digest = 'sha256:' + hashlib.sha256(Path('dist/bundle/inventory.json').read_bytes()).hexdigest()
          subprocess.run(['.local/release-native/linux/kimage-install', 'bundle-check', '--bundle', 'dist/bundle', '--trusted-inventory', digest], check=True)
          PY
          tar -czf dist/verified-bundle-${{ matrix.architecture }}.tar.gz -C dist/bundle .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-bundle-${{ matrix.architecture }}
          path: dist/verified-bundle-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assets:
    name: Assemble both native bundles and four installers
    needs: [bundle, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-bundle-*
          merge-multiple: true
          path: .local/verified-bundles
      - name: Install Cargo metadata toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Package versioned release assets
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf .local/verified-bundles/verified-bundle-amd64.tar.gz -C dist/amd64
          tar -xzf .local/verified-bundles/verified-bundle-arm64.tar.gz -C dist/arm64
          cargo metadata --locked --format-version 1 > dist/cargo-metadata.json
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/package-release.py --bundle dist/amd64 --bundle dist/arm64 --out dist/release --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish tagged assets and crates through OIDC
    needs: assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-validate-${{ runner.os }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Stage exact assets in a draft GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-github-release.py --tag "$RELEASE_TAG" --assets dist/release
      - name: Authenticate with crates.io through OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify publishable packages
        if: inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py --dry-run
      - name: Publish packages in dependency order or verify identical prior uploads
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py
      - name: Publish complete GitHub release and verify automatic download
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          KIMAGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-github-release.py --tag "$RELEASE_TAG" --assets dist/release --finalize
          VERSION=${RELEASE_TAG#v}
          mkdir -p .local
          chmod +x "dist/release/kimage-v${VERSION}-linux-amd64"
          "dist/release/kimage-v${VERSION}-linux-amd64" bundle-fetch \
            --bundle-cache .local/published-bundles > .local/fetched-bundle.json &
          FIRST_FETCH=$!
          "dist/release/kimage-v${VERSION}-linux-amd64" bundle-fetch \
            --bundle-cache .local/published-bundles > .local/concurrent-bundle.json &
          SECOND_FETCH=$!
          wait "$FIRST_FETCH"
          wait "$SECOND_FETCH"
          "dist/release/kimage-v${VERSION}-linux-amd64" bundle-check \
            --bundle-cache .local/published-bundles --offline
          "dist/release/kimage-v${VERSION}-linux-amd64" bundle-fetch --platform linux/arm64 \
            --bundle-cache .local/published-bundles > .local/fetched-arm64.json
          "dist/release/kimage-v${VERSION}-linux-amd64" bundle-check --platform linux/arm64 \
            --bundle-cache .local/published-bundles --offline
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG']
          downloaded = json.loads(Path('.local/fetched-bundle.json').read_text())
          assert downloaded == json.loads(Path('.local/concurrent-bundle.json').read_text())
          inventory = Path('dist/release') / ('kimage-bundle-' + version + '-linux-amd64.inventory.json')
          assert downloaded['trustedInventory'] == 'sha256:' + hashlib.sha256(inventory.read_bytes()).hexdigest()
          arm = json.loads(Path('.local/fetched-arm64.json').read_text())
          inventory = Path('dist/release') / ('kimage-bundle-' + version + '-linux-arm64.inventory.json')
          assert arm['trustedInventory'] == 'sha256:' + hashlib.sha256(inventory.read_bytes()).hexdigest()
          assert arm['bundle'] != downloaded['bundle']
          PY
          gh api --method POST repos/inferal-oss/kimage/dispatches -f event_type=release-published
