name: Native Kubernetes E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      diagnostic_certificate:
        description: Optional public X.509 recipient certificate for encrypted CI-only Helm failure capture
        type: string
        required: false
        default: ""
      diagnostic_stress:
        description: Repeat native failed-attempt checks with fresh Images
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  build:
    name: Build E2E components (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/src/**', 'scripts/prepare-argocd-next.py') }}
          restore-keys: |
            e2e-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}-
            e2e-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Build native components and fixture executable
        run: |
          rm -f target/${{ matrix.target }}/release/kimage-*
          cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
          python3 - <<'PYVERSION'
          import subprocess,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          for role in ['install','operator','admission','input','exporter','gateway','proxy']:
              expected='0.3.0' if role in ['gateway','proxy'] else version
              actual=subprocess.check_output(['target/${{ matrix.target }}/release/kimage-'+role,'--version'],text=True).strip()
              assert actual=='kimage-'+role+' '+expected,actual
          PYVERSION
          mkdir -p .local/e2e
          rustc --edition=2024 --target ${{ matrix.target }} -C opt-level=z -C strip=symbols -C panic=abort scripts/fixtures/build-probe.rs -o .local/e2e/probe
          mkdir -p .local/e2e/probes
          rustc --edition=2024 --target ${{ matrix.target }} -C opt-level=z -C strip=symbols -C panic=abort scripts/fixtures/mixed-platform-probe.rs -o .local/e2e/probes/probe-${{ matrix.architecture }}
          python3 scripts/e2e-image-inputs.py --build-probes .local/e2e/image-input-probes --architectures ${{ matrix.architecture }}
      - name: Verify actual published predecessor assets
        env:
          KIMAGE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch-predecessor.py --architecture ${{ matrix.architecture }} --output .local/e2e/previous
      - name: Fetch pinned native upstream components
        run: python3 scripts/fetch-release-inputs.py --architecture ${{ matrix.architecture }} --out .local/e2e/upstream
      - name: Package native registry images
        run: |
          cargo metadata --locked --format-version 1 > .local/e2e/cargo-metadata.json
          python3 scripts/package-component-images.py --architecture ${{ matrix.architecture }} \
            --linux-dir target/${{ matrix.target }}/release --registry .local/e2e/upstream/registry \
            --buildkit-dir .local/e2e/upstream/buildkit --cargo-metadata .local/e2e/cargo-metadata.json --out .local/e2e/images
          cp target/${{ matrix.target }}/release/kimage-install .local/e2e/kimage-install
          cp .local/e2e/upstream/registry .local/e2e/registry
          python3 scripts/prepare-argocd-next.py --workspace .local/argocd-next-source
          cargo build --locked --release --manifest-path .local/argocd-next-source/Cargo.toml --target-dir target --target ${{ matrix.target }} -p kimage-control --bin kimage-operator-argocd-conformance --bin kimage-admission-argocd-conformance --bin kimage-input-argocd-conformance --bin kimage-exporter-argocd-conformance --bin kimage-install-argocd-conformance
          cp target/${{ matrix.target }}/release/kimage-install-argocd-conformance .local/e2e/next-installer
          target/${{ matrix.target }}/release/kimage-install-argocd-conformance schemas > .local/e2e/future-schemas.json
          python3 -c "import json; assert json.load(open('.local/e2e/future-schemas.json')) == json.load(open('crates/control/tests/fixtures/additive-revision-7.json'))"
          mkdir -p .local/e2e/next-bins
          for role in operator admission input exporter; do
            cp target/${{ matrix.target }}/release/kimage-$role-argocd-conformance .local/e2e/next-bins/kimage-$role
          done
          for role in gateway proxy; do
            cp target/${{ matrix.target }}/release/kimage-$role .local/e2e/next-bins/kimage-$role
          done
          python3 scripts/package-component-images.py --architecture ${{ matrix.architecture }} \
            --linux-dir .local/e2e/next-bins --registry .local/e2e/upstream/registry \
            --buildkit-dir .local/e2e/upstream/buildkit --cargo-metadata .local/e2e/cargo-metadata.json --out .local/e2e/next-images --version 0.6.2-argocd-test.0 --api-schema-revision 7
          tar -czf .local/e2e-native-${{ matrix.architecture }}.tar.gz -C .local/e2e images next-images probe probes image-input-probes previous kimage-install next-installer registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-native-${{ matrix.architecture }}
          path: .local/e2e-native-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    name: Assemble complete component indexes
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: e2e-native-*
          merge-multiple: true
          path: .local/native
      - name: Verify and assemble native OCI graphs and pinned chart
        run: |
          mkdir -p .local/amd64 .local/arm64
          tar -xzf .local/native/e2e-native-amd64.tar.gz -C .local/amd64
          tar -xzf .local/native/e2e-native-arm64.tar.gz -C .local/arm64
          python3 scripts/assemble-component-images.py --native .local/amd64/images --native .local/arm64/images --out .local/components
          for role in admission builder exporter gateway input operator proxy registry; do
            .local/amd64/kimage-install verify --archive .local/components/$role.oci.tar --root .local/components/$role.root.json
          done
          python3 scripts/package-chart.py --catalog .local/components/component-images.json --out .local/chart
          cp .local/components/component-images.json .local/chart/component-images.json
          python3 scripts/assemble-component-images.py --native .local/amd64/next-images --native .local/arm64/next-images --out .local/next-components
          python3 scripts/package-chart.py --catalog .local/next-components/component-images.json --out .local/next-chart --chart tests/fixtures/argocd-next-chart
          cp .local/next-components/component-images.json .local/next-chart/component-images.json
          rm .local/next-components/*.oci.tar
          tar -czf .local/argocd-next-layouts.tar.gz -C .local/next-components .
          rm .local/components/*.oci.tar
          tar -czf .local/component-layouts.tar.gz -C .local/components .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: component-layouts
          path: .local/component-layouts.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: component-catalog-chart
          path: .local/chart/*
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: argocd-next-layouts
          path: .local/argocd-next-layouts.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: argocd-next-chart
          path: .local/next-chart/*
          retention-days: 7

  install:
    name: ${{ matrix.architecture }} / ${{ matrix.scope }} / ${{ matrix.mode }} install
    needs: [build, assemble]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        scope: [namespace, cluster]
        mode: [cli, helm]
        include:
          - architecture: amd64
            os: ubuntu-24.04
          - architecture: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-native-${{ matrix.architecture }}
          path: .local
      - name: Unpack verified native fixture
        run: |
          mkdir -p .local/e2e
          tar -xzf .local/e2e-native-${{ matrix.architecture }}.tar.gz -C .local/e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: component-layouts
          path: .local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: component-catalog-chart
          path: .local/chart
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: argocd-next-layouts
          path: .local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: argocd-next-chart
          path: .local/next-chart
      - name: Install registry tooling and Helm
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          python3 scripts/fetch-helm.py --out .local/helm
          sudo install -m 755 .local/helm /usr/local/bin/helm
          mkdir -p .local/components
          tar -xzf .local/component-layouts.tar.gz -C .local/components
          mkdir -p .local/next-components
          tar -xzf .local/argocd-next-layouts.tar.gz -C .local/next-components
          python3 scripts/prepare-image-pull-fixture.py --images .local/components --additional-images .local/next-components --registry .local/e2e/registry --directory .local/e2e-registry
      - name: Start pinned disposable Kubernetes fixture
        run: python3 scripts/prepare-e2e-cluster.py --directory .local/e2e-cluster
      - name: Configure optional encrypted Helm diagnostics
        if: inputs.diagnostic_certificate != '' && matrix.mode == 'helm'
        env:
          KIMAGE_HELM_DIAGNOSTIC_CERT: ${{ inputs.diagnostic_certificate }}
        run: |
          python3 scripts/helm-diagnostics.py --setup .local/e2e/helm-diagnostics --helm /usr/local/bin/helm
          printf '%s\n' "$GITHUB_WORKSPACE/.local/e2e/helm-diagnostics/bin" >> "$GITHUB_PATH"
      - name: Exercise published predecessor upgrade, interruptions and compatible rollback
        env:
          KIMAGE_DIAGNOSTIC_STRESS: ${{ (github.event_name != 'pull_request' || inputs.diagnostic_stress) && 'true' || 'false' }}
          KIMAGE_TEST_DIAGNOSTIC_CERT: ${{ inputs.diagnostic_certificate }}
        run: |
          python3 - <<'PYCONFIG'
          import glob,json,os,subprocess
          from pathlib import Path
          context=subprocess.check_output(['k3s','kubectl','config','current-context'],text=True).strip()
          config=dict(kubeconfig=os.environ['KUBECONFIG'],context=context,namespace='upgrade-app',systemNamespace='upgrade-system',installation='upgrade',probes=str(Path('.local/e2e/probes').resolve()),output=str(Path('.local/e2e/lifecycle').resolve()),installer=str(Path('.local/e2e/kimage-install').resolve()),previous=str(Path('.local/e2e/previous').resolve()),catalog=os.environ['KIMAGE_E2E_IMAGE_CATALOG'],chart=str(Path(glob.glob('.local/chart/kimage-*.tgz')[0]).resolve()),mode='${{ matrix.mode }}',scope='${{ matrix.scope }}',runtimeProfile='k3s',port=17702,registryNode='kimage-e2e',kubectlCommand=['k3s','kubectl'])
          Path('.local/e2e/lifecycle-config.json').write_text(json.dumps(config))
          PYCONFIG
          python3 scripts/e2e-upgrade.py --run --config .local/e2e/lifecycle-config.json
      - name: Exercise registry pulls, native builds, controllers and scope boundaries
        run: |
          python3 scripts/e2e-install.py --scope ${{ matrix.scope }} --mode ${{ matrix.mode }} \
            --image-catalog "$KIMAGE_E2E_IMAGE_CATALOG" --chart .local/chart/kimage-*.tgz \
            --installer .local/e2e/kimage-install --probe .local/e2e/probe --output .local/e2e/results
      - name: Install disposable Argo CD controller
        if: matrix.mode == 'cli'
        run: python3 scripts/prepare-argocd-fixture.py
      - name: Exercise real Argo CD sync, recovery and retention
        if: matrix.mode == 'cli'
        run: |
          python3 - <<'PYCONFIG'
          import json,os,subprocess
          from pathlib import Path
          context=subprocess.check_output(['k3s','kubectl','config','current-context'],text=True).strip()
          config=dict(kubeconfig=os.environ['KUBECONFIG'],context=context,namespace='kimage-argo-app',systemNamespace='kimage-argo-system',installation='kimageargo',probes=str(Path('.local/e2e/probes').resolve()),output=str(Path('.local/e2e/argocd-results').resolve()),catalog=os.environ['KIMAGE_E2E_IMAGE_CATALOG'],installer=str(Path('.local/e2e/kimage-install').resolve()),scope='${{ matrix.scope }}',port=17703,registryNode='kimage-e2e',runtimeProfile='k3s',sourceRevision='${{ github.sha }}',nextCatalog=os.environ['KIMAGE_E2E_NEXT_CATALOG'],disposableApi=True,previousCatalog=str(Path('.local/e2e/previous/component-images.json').resolve()),kubectlCommand=['k3s','kubectl'])
          Path('.local/e2e/argocd-config.json').write_text(json.dumps(config))
          PYCONFIG
          python3 scripts/e2e-argocd.py --run --config .local/e2e/argocd-config.json
      - name: Roll back populated future schema with unchanged baseline CLI and Helm
        run: |
          python3 - <<'PYCONFIG'
          import glob,json,os,subprocess
          from pathlib import Path
          context=subprocess.check_output(['k3s','kubectl','config','current-context'],text=True).strip()
          config=dict(kubeconfig=os.environ['KUBECONFIG'],context=context,namespace='forward-app',systemNamespace='forward-system',installation='forward',probes=str(Path('.local/e2e/probes').resolve()),output=str(Path('.local/e2e/forward-results').resolve()),installer=str(Path('.local/e2e/kimage-install').resolve()),previous=str(Path('.local/e2e/previous').resolve()),catalog=os.environ['KIMAGE_E2E_IMAGE_CATALOG'],chart=str(Path(glob.glob('.local/chart/kimage-*.tgz')[0]).resolve()),mode='${{ matrix.mode }}',scope='${{ matrix.scope }}',runtimeProfile='k3s',port=17704,registryNode='kimage-e2e',kubectlCommand=['k3s','kubectl'],disposableApi=True,nextInstaller=str(Path('.local/e2e/next-installer').resolve()),nextCatalog=os.environ['KIMAGE_E2E_NEXT_CATALOG'],nextChart=str(Path(glob.glob('.local/next-chart/kimage-*.tgz')[0]).resolve()))
          Path('.local/e2e/forward-config.json').write_text(json.dumps(config))
          PYCONFIG
          python3 scripts/e2e-forward-compatibility.py --run --config .local/e2e/forward-config.json
      - name: Upload non-sensitive acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.architecture }}-${{ matrix.scope }}-${{ matrix.mode }}
          path: |
            .local/e2e/results/*.json
            .local/e2e/results/*.log
            .local/e2e/forward-results/results.json
            .local/e2e/lifecycle/results.json
            .local/e2e/lifecycle/image-inputs/results.json
            .local/e2e/lifecycle/image-inputs/*.p7m
            .local/e2e/argocd-results/results.json
            .local/e2e/argocd-results/builds/results.json
            .local/e2e/helm-diagnostics/output/*.p7m
          if-no-files-found: warn
          retention-days: 14
