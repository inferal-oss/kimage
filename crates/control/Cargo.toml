[package]
name = "kimage-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Kubernetes-native image production, verified delivery, and lifecycle management"
documentation = "https://kimage.dev/docs/"
readme = "README.md"
keywords = ["kubernetes", "oci", "images", "registry", "build"]
categories = ["command-line-utilities", "development-tools::build-utils"]
include = ["src/**", "schemas/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
kimage-core = { version = "=0.6.0", path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
flate2.workspace = true
tempfile.workspace = true
schemars.workspace = true
kube = { version = "=4.2.0", features = ["client", "runtime", "derive", "ws"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_36", "schemars"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
axum = "=0.8.9"
futures = "=0.3.34"
tokio-util = { version = "=0.7.20", features = ["io", "rt"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "service", "tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "=2.2.0"
tower-http = { version = "=0.6.11", features = ["limit"] }
hmac = "=0.12.1"
tar = "=0.4.46"
getrandom = "=0.4.3"
socket2 = { version = "=0.6.5", features = ["all"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "ring"] }
time = "=0.3.55"

[dev-dependencies]
json-patch = "=4.2.0"
