
root = "/cache"
insecure-entitlements = []
[log]
level = "panic"
[grpc]
address = ["unix:///run/buildkit/buildkitd.sock", "tcp://0.0.0.0:1234"]
[grpc.tls]
cert = "/credentials/server.crt"
key = "/credentials/server.key"
ca = "/credentials/ca.crt"
[history]
maxEntries = 0
[cdi]
disabled = true
[worker.oci]
enabled = true
platforms = ["linux/amd64"]
snapshotter = "native"
rootless = true
noProcessSandbox = false
binary = "/buildkit-runc"
networkMode = "host"
max-parallelism = 1
gc = true
reservedSpace = "256MiB"
maxUsedSpace = "2GiB"
minFreeSpace = "1GiB"
[[worker.oci.gcpolicy]]
all = true
reservedSpace = "256MiB"
maxUsedSpace = "2GiB"
keepDuration = "24h"
[worker.containerd]
enabled = false
[frontend."dockerfile.v0"]
enabled = true
[frontend."gateway.v0"]
enabled = false
