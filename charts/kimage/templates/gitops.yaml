      ]
    },
    {
      "apiGroups": [
        "kimage.dev"
      ],
      "resources": [
        "images",
        "images/status",
        "imagereleases",
        "imagereleases/status",
        "imagedemands",
        "imagedemands/status",
        "imageexports",
        "imageexports/status"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": {{ printf "%s-%s" $ns $name | toJson }},
    "labels": {
      "kimage.dev/provisioner": {{ $id | toJson }},
      "app.kubernetes.io/name": "kimage-provisioner"
    }
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": {{ printf "%s-%s" $ns $name | toJson }}
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": {{ $name | toJson }},
      "namespace": {{ $ns | toJson }}
    }
  ]
}
---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": {{ $name | toJson }},
    "namespace": {{ $ns | toJson }},
    "labels": {
      "kimage.dev/provisioner": {{ $id | toJson }},
      "app.kubernetes.io/name": "kimage-provisioner"
    }
  },
  "data": {
    "desired.json": {{ $configuration | toJson }}
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": {{ $name | toJson }},
    "namespace": {{ $ns | toJson }},
    "labels": {
      "kimage.dev/provisioner": {{ $id | toJson }},
      "app.kubernetes.io/name": "kimage-provisioner"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "progressDeadlineSeconds": 900,
    "selector": {
      "matchLabels": {
        "kimage.dev/provisioner": {{ $id | toJson }},
        "app.kubernetes.io/name": "kimage-provisioner"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "kimage.dev/provisioner": {{ $id | toJson }},
          "app.kubernetes.io/name": "kimage-provisioner"
        },
        "annotations": {
          "checksum/configuration": {{ sha256sum $configuration | toJson }}
        }
      },
      "spec": {
        "serviceAccountName": {{ $name | toJson }},
        "automountServiceAccountToken": true,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "runAsGroup": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "provisioner",
            "image": {{ $image | toJson }},
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "/kimage-operator",
              "provision",
              "--configuration",
              "/desired/desired.json"
            ],
            "ports": [
              {
                "name": "health",
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "256Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": "health"
              },
              "periodSeconds": 5,
              "failureThreshold": 2
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/livez",
                "port": "health"
              },
              "periodSeconds": 10,
              "failureThreshold": 6
            },
            "volumeMounts": [
              {
                "name": "desired",
                "mountPath": "/desired",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "desired",
            "configMap": {
              "name": {{ $name | toJson }}
            }
          }
        ]
      }
    }
  }
}
{{- end -}}
