apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kimage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kimage.dev/charts
    chart: kimage
    targetRevision: 0.5.2
    helm:
      releaseName: kimage
      valuesObject:
        gitops:
          enabled: true
        scope: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: kimage-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
